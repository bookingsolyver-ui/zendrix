name: outbox

# Reenvia a fila de saída da Meta (tentativas por fazer, mensagens que ficaram para trás) de 5 em 5 minutos.
# Substitui o cron por minuto da Vercel, que só existe no plano Pro. O endpoint exige o CRON_SECRET.
#
# Configurar em GitHub → Settings → Secrets and variables → Actions:
#   CRON_SECRET  o mesmo valor que está na Vercel
#   APP_URL      o endereço público, sem barra no fim (ex.: https://zentrix.app)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Chamar /api/cron/process-outbox
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "::warning::CRON_SECRET ou APP_URL não estão definidos nos secrets do repositório; nada a fazer."
            exit 0
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/process-outbox")
          echo "HTTP $status"; cat response.json; echo
          [ "$status" = "200" ]
