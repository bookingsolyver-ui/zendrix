# OpenWA (motor Baileys) + Caddy (HTTPS automático) para o canal WhatsApp por QR do Kwanza Flow.
# Usa a imagem publicada do OpenWA (não compila nada). Arranque: scripts/deploy-openwa.sh
# Todas as variáveis vêm do ficheiro .env desta pasta (gerado pelo script, permissões 600).

services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:${OPENWA_VERSION:-latest}
    container_name: openwa
    restart: unless-stopped
    stop_grace_period: 75s
    # Endurecimento (igual ao compose oficial do OpenWA): só as capacidades que o entrypoint precisa.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
    read_only: true
    tmpfs: ["/tmp"]
    pids_limit: 512
    mem_limit: ${OPENWA_MEM_LIMIT:-2g}
    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      HOME: /tmp
      PORT: "2785"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENGINE_TYPE: baileys            # sem Chromium: ~10x mais leve que o whatsapp-web.js
      AUTO_START_SESSIONS: "true"     # volta a ligar as sessões depois de um reinício (UMA só instância)
      API_MASTER_KEY: ${API_MASTER_KEY:?defina API_MASTER_KEY no .env}
      BASE_URL: https://${OPENWA_DOMAIN:?defina OPENWA_DOMAIN no .env}
    volumes:
      # Sessões, base de dados SQLite e ficheiros. NÃO apagar: sem isto, todos os clientes leem o QR de novo.
      - ./data/openwa:/app/data
    # Sem "ports": só o Caddy (rede interna) fala com o OpenWA. Nada exposto diretamente na internet.
    expose: ["2785"]
    networks: [edge]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2785/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    container_name: openwa-caddy
    restart: unless-stopped
    depends_on:
      openwa:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      OPENWA_DOMAIN: ${OPENWA_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data           # certificados TLS (evita pedir novos a cada reinício)
    networks: [edge]

networks:
  edge:
